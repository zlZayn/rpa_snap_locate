[project]
name = "rpa-snap-locate"
version = "0.1.0"
description = "Lightweight visual-driven desktop automation recorder"
requires-python = ">=3.11"
dependencies = [
    "mss>=9.0.0",
    "pygetwindow>=0.0.9",
    "pyautogui>=0.9.54",
    "keyboard>=0.13.5",
    "pyyaml>=6.0",
    "pillow>=10.0.0",
    "mouse>=0.7.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[project.scripts]
rpa-record = "main:main"

[tool.uv]
# 锁文件源固定为官方 PyPI，且此处优先级高于本机 ~/AppData/Roaming/uv/uv.toml。
# 不加这一段时，本机全局 index-url 指向镜像，任何一次 `uv lock` 都会把 uv.lock
# 的 registry 整片改写成镜像源，境外 CI 拉镜像会 tcp 超时、uv sync --frozen 失败。
# 注：`default-index` 字段 uv 0.11 不认（报 unknown field 并整体忽略该节），
# 必须用下面的 [[tool.uv.index]] 表。
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
[tool.ruff]
# 不碰 Markdown 里嵌的 Python 片段：文档与笔记正文不属格式化范围
extend-exclude = ["*.md"]
